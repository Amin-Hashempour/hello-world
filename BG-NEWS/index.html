<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101015"><title>تازه‌های بازی</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script>
</head>
<body>
<div class="shell">
<main>
<section class="toolbar" aria-label="فیلتر منابع"><div class="filters"><button class="filter active" data-filter="all" aria-pressed="true">همهٔ منابع <span id="total">۰</span></button><button class="filter" data-filter="Z" aria-pressed="false"><b>Z</b> زومجی</button><button class="filter" data-filter="V" aria-pressed="false"><b>V</b> ویجیاتو</button><button class="filter" data-filter="G" aria-pressed="false"><b>G</b> گیمفا</button></div><span class="update-time" id="update-time">هنوز به‌روزرسانی نشده</span></section>
<div id="messages" role="status" aria-live="polite"></div>
<section id="articles" class="articles" aria-label="مطالب"></section>
<section id="empty" class="empty"><div class="empty-art"><span class="orbit orbit-one"></span><span class="orbit orbit-two"></span><span class="empty-symbol">↻</span><i></i></div><h2>یک رفرش تا تازه‌ترین‌ها</h2><p>دکمهٔ بنفش را بزن؛ آخرین مطلب هر سه رسانه اینجا می‌آید.<br>دفعه‌های بعد، مطالب جدید به این فهرست اضافه می‌شوند.</p><span class="empty-caption">سه رسانه. یک جای خلوت.</span></section>
<footer><span>ZOOMG / VIGIATO / GAMEFA</span></footer>
</main></div>
<div class="refresh-wrap"><span id="refresh-label">تازه‌ها رو بگیر</span><button id="refresh" aria-label="دریافت مطالب جدید" title="دریافت مطالب جدید"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.5-1L20 9M4 15l2.4 3A7 7 0 0 0 17.9 17"/></svg></button></div>
</body></html>
